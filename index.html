<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sestav keltský hrob - Moravská archeologie</title>
    <style>
        :root {
            --bg-color: #1a1614;
            --panel-bg: #2d241e;
            --accent-gold: #d4af37;
            --text-light: #f5eedc;
            --correct-color: #4a7c59;
            --error-color: #a83232;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 1rem;
            color: #c5b49c;
        }

        /* Herní plocha */
        .game-board {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
            margin-bottom: 15px;
        }

        .grave-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        .grave-container h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: var(--accent-gold);
            text-align: center;
        }

        /* Oblast hrobu s lokálním obrázkem pozadí */
        .grave-area {
            flex: 1;
            background-color: #14100e;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
            border: 2px dashed #4a3d31;
            position: relative;
            overflow: hidden;
        }

        /* Lokální soubory pozadí hrobů */
        #male-grave {
            background-image: url('hrob-muz.png');
        }

        #female-grave {
            background-image: url('hrob-zena.png');
        }

        /* Spodní zásobník artefaktů */
        .inventory-panel {
            height: 130px;
            background-color: var(--panel-bg);
            border: 2px solid #5c4a3d;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
        }

        .inventory-panel h3 {
            margin: 0 0 6px 0;
            font-size: 0.95rem;
            color: #c5b49c;
            text-align: center;
        }

        .items-pool {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
            overflow-x: auto;
            padding: 5px;
        }

        /* Karta předmětu */
        .item {
            width: 75px;
            height: 75px;
            min-width: 75px;
            background-color: #3d3127;
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            cursor: grab;
            touch-action: none;
            transition: border-color 0.2s;
        }

        .item img {
            max-width: 100%;
            max-height: 42px;
            object-fit: contain;
            pointer-events: none;
        }

        .item .name {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 3px;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Předmět po vhození do hrobu - přichycený na anatomické pozici */
        .grave-area .item {
            position: absolute;
            width: 65px;
            height: 65px;
            min-width: unset;
            background-color: rgba(30, 24, 20, 0.9);
            border-color: var(--correct-color);
            cursor: default;
            transform: translate(-50%, -50%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .grave-area .item img {
            max-height: 35px;
        }

        /* Výherní modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 3px solid var(--accent-gold);
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-top: 0;
        }

        .modal-content button {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sestav keltský hrob</h1>
        <p>Přetáhni artefakty kamkoliv do hrobu – samy zapadnou na své anatomické místo.</p>
    </header>

    <div class="game-board">
        <!-- Mužský hrob -->
        <div class="grave-container">
            <h2>Mužský hrob (Válečník)</h2>
            <div class="grave-area" id="male-grave" data-target="male"></div>
        </div>

        <!-- Ženský hrob -->
        <div class="grave-container">
            <h2>Ženský hrob</h2>
            <div class="grave-area" id="female-grave" data-target="female"></div>
        </div>
    </div>

    <!-- Zásobník prvků -->
    <div class="inventory-panel">
        <h3>Nalezené artefakty:</h3>
        <div class="items-pool" id="pool"></div>
    </div>

    <!-- Výherní okno -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>Hrobová výbava je kompletní!</h2>
            <p>Skvělá práce! Správně jsi uložil všechny artefakty na tělo zemřelého podle moravských nálezů.</p>
            <button onclick="resetGame()">Nová hra</button>
        </div>
    </div>

    <script>
        // Seznam předmětů, jejich souborů a anatomických souřadnic v %
        const itemsData = [
            // Mužské předměty
            { id: 'mec', name: 'Meč', img: 'mec.png', target: 'male', posX: '65%', posY: '55%' },
            { id: 'stit', name: 'Štít', img: 'stit.png', target: 'male', posX: '30%', posY: '50%' },
            { id: 'opasek-muz', name: 'Opasek', img: 'opasek-muz.png', target: 'male', posX: '50%', posY: '52%' },
            { id: 'spona-muz', name: 'Spona', img: 'spona-muz.png', target: 'male', posX: '50%', posY: '32%' },
            
            // Ženské předměty
            { id: 'nakrcnik', name: 'Nákrčník', img: 'nakrcnik.png', target: 'female', posX: '50%', posY: '22%' },
            { id: 'spona-zena', name: 'Spony', img: 'spona-zena.png', target: 'female', posX: '50%', posY: '32%' },
            { id: 'opasek-zena', name: 'Opasek', img: 'opasek-zena.png', target: 'female', posX: '50%', posY: '55%' },
            { id: 'bronz-naramek', name: 'Náramky', img: 'bronz-naramek.png', target: 'female', posX: '32%', posY: '45%' },
            { id: 'nanoznik', name: 'Nánožník', img: 'nanoznik.png', target: 'female', posX: '50%', posY: '85%' },
            { id: 'preslen', name: 'Přeslen', img: 'preslen.png', target: 'female', posX: '75%', posY: '65%' },

            // Univerzální předmět
            { id: 'keramika', name: 'Keramika', img: 'keramika.png', target: 'both', posX: '75%', posY: '80%' }
        ];

        let draggedItem = null;
        let score = 0;
        const totalItems = itemsData.length;

        function initGame() {
            const pool = document.getElementById('pool');
            document.getElementById('male-grave').innerHTML = '';
            document.getElementById('female-grave').innerHTML = '';
            pool.innerHTML = '';
            score = 0;
            document.getElementById('win-modal').style.display = 'none';

            // Zamíchání nabídky předmětů
            const shuffledItems = [...itemsData].sort(() => Math.random() - 0.5);

            shuffledItems.forEach(item => {
                const el = document.createElement('div');
                el.classList.add('item');
                el.setAttribute('draggable', 'true');
                el.id = item.id;
                el.dataset.target = item.target;
                el.dataset.posX = item.posX;
                el.dataset.posY = item.posY;

                el.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
                    <div class="name">${item.name}</div>
                `;

                // Podpora pro myš
                el.addEventListener('dragstart', (e) => {
                    draggedItem = el;
                    e.dataTransfer.setData('text/plain', el.id);
                });

                // Podpora pro dotykové obrazovky
                el.addEventListener('touchstart', (e) => {
                    draggedItem = el;
                    el.style.position = 'fixed';
                    el.style.zIndex = '1000';
                }, {passive: true});

                el.addEventListener('touchmove', (e) => {
                    if (!draggedItem) return;
                    const touch = e.touches[0];
                    draggedItem.style.left = (touch.clientX - 35) + 'px';
                    draggedItem.style.top = (touch.clientY - 35) + 'px';
                }, {passive: true});

                el.addEventListener('touchend', (e) => {
                    if (!draggedItem) return;
                    draggedItem.style.position = 'static';
                    
                    const touch = e.changedTouches[0];
                    const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    const graveArea = elementBelow ? elementBelow.closest('.grave-area') : null;

                    if (graveArea) {
                        evaluateDrop(draggedItem, graveArea);
                    }
                    draggedItem = null;
                });

                pool.appendChild(el);
            });
        }

        // Drag & Drop zóny pro myš
        document.querySelectorAll('.grave-area').forEach(area => {
            area.addEventListener('dragover', (e) => e.preventDefault());
            area.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedItem) {
                    evaluateDrop(draggedItem, area);
                }
            });
        });

        function evaluateDrop(item, graveArea) {
            const itemTarget = item.dataset.target;
            const graveTarget = graveArea.dataset.target;

            if (itemTarget === graveTarget || itemTarget === 'both') {
                graveArea.appendChild(item);
                item.setAttribute('draggable', 'false');
                
                // Přichycení na přesnou anatomickou pozici
                item.style.left = item.dataset.posX;
                item.style.top = item.dataset.posY;
                
                score++;

                if (score === totalItems) {
                    setTimeout(() => {
                        document.getElementById('win-modal').style.display = 'flex';
                    }, 500);
                }
            } else {
                // Špatné umístění - animace odmítnutí
                item.style.borderColor = 'var(--error-color)';
                setTimeout(() => {
                    item.style.borderColor = 'var(--accent-gold)';
                    item.style.position = 'static';
                    document.getElementById('pool').appendChild(item);
                }, 300);
            }
        }

        function resetGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
