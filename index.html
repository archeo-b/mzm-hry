<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sestav keltský hrob - Moravská archeologie</title>
    <style>
        :root {
            --bg-color: #1a1614;
            --panel-bg: #2d241e;
            --accent-gold: #d4af37;
            --text-light: #f5eedc;
            --correct-color: #4a7c59;
            --error-color: #a83232;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto; /* Povolí skrolování na mobilu */
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 1rem;
            color: #c5b49c;
        }

        /* Hlavní layout pro PC / Kiosk (na šířku) */
        .main-layout {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .game-board {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex: 2;
        }

        .grave-container {
            width: 100%;
            max-width: 400px;
            height: 70vh;
            min-height: 480px;
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        .grave-container h2 {
            margin: 0 0 8px 0;
            font-size: 1.05rem;
            color: var(--accent-gold);
            text-align: center;
            white-space: nowrap;
        }

        .grave-area {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #14100e;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
            border: none;
            position: relative;
            overflow: hidden;
        }

        #male-grave {
            background-image: url('hrob-muz.png');
        }

        #female-grave {
            background-image: url('hrob-zena.png');
        }

        /* Zásobník prvků */
        .inventory-panel {
            width: 320px;
            height: 70vh;
            min-height: 480px;
            background-color: var(--panel-bg);
            border: 2px solid #5c4a3d;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .inventory-panel h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--accent-gold);
            text-align: center;
        }

        .items-pool {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            align-content: start;
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        /* Karta předmětu v zásobníku */
        .item {
            height: 90px;
            background-color: #3d3127;
            border: 2px solid var(--accent-gold);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            cursor: grab;
            touch-action: none;
            transition: border-color 0.2s, transform 0.2s;
        }

        .item img {
            max-width: 100%;
            max-height: 50px;
            object-fit: contain;
            pointer-events: none;
        }

        .item .name {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 5px;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Předmět v hrobě */
        .grave-area .item {
            position: absolute;
            width: 60px;
            height: 60px;
            min-width: unset;
            background-color: transparent;
            border: none;
            box-shadow: none;
            cursor: pointer;
            transform: translate(-50%, -50%) scale(var(--item-scale, 1));
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        transform 0.2s ease;
            padding: 0;
        }

        .grave-area .item img {
            max-height: 100%;
            max-width: 100%;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.8));
            transition: filter 0.2s ease;
        }

        .grave-area .item:hover img,
        .grave-area .item:active img {
            filter: drop-shadow(0 0 10px rgba(255, 223, 100, 1)) drop-shadow(0 4px 10px rgba(0,0,0,1));
        }

        .grave-area .item .name {
            display: none;
        }

        /* Responsive úprava pro telefony (displeje na výšku nebo s malou šířkou) */
        @media (max-width: 900px) {
            body {
                overflow-y: auto;
            }

            .main-layout {
                flex-direction: column-reverse; /* Zásobník dáme nahoru nebo dolů dle potřeby */
                align-items: center;
            }

            .game-board {
                flex-direction: column;
                width: 100%;
            }

            .grave-container {
                width: 100%;
                max-width: 360px;
                height: 520px;
            }

            .inventory-panel {
                width: 100%;
                max-width: 360px;
                height: auto;
                max-height: 250px;
            }

            .items-pool {
                grid-template-columns: repeat(4, 1fr); /* 4 v řadě na mobilu */
            }
        }

        /* Modální okna */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 3px solid var(--accent-gold);
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .modal-content h2 {
            color: var(--accent-gold);
            margin-top: 0;
        }

        .modal-content p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-light);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--accent-gold);
            font-size: 2rem;
            cursor: pointer;
        }

        .modal-content button.action-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sestav keltský hrob</h1>
        <p>Přetáhni artefakty do správného hrobu</p>
    </header>

    <div class="main-layout">
        <!-- Hroby -->
        <div class="game-board">
            <div class="grave-container">
                <h2>Mužský hrob (Válečník)</h2>
                <div class="grave-area" id="male-grave" data-target="male"></div>
            </div>
            <div class="grave-container">
                <h2>Ženský hrob</h2>
                <div class="grave-area" id="female-grave" data-target="female"></div>
            </div>
        </div>

        <!-- Zásobník prvků -->
        <div class="inventory-panel">
            <h3>Nalezené artefakty:</h3>
            <div class="items-pool" id="pool"></div>
        </div>
    </div>

    <!-- Informační okno -->
    <div class="modal" id="info-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeInfoModal()">&times;</button>
            <h2 id="info-title">Název předmětu</h2>
            <p id="info-text">Zde bude text o předmětu...</p>
            <button class="action-btn" onclick="closeInfoModal()">Rozumím</button>
        </div>
    </div>

    <!-- Výherní okno -->
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>Hrobová výbava je kompletní!</h2>
            <p>Skvělá práce! Úspěšně jsi uložil všechny artefakty na tělo zemřelého.</p>
            <button class="action-btn" onclick="resetGame()">Nová hra</button>
        </div>
    </div>

    <script>
        const itemsData = [
            { id: 'mec', name: 'Železný meč', img: 'mec.png', target: 'male', posX: '38%', posY: '58%', scale: 2.1, info: 'Dlouhé železné meče v kovaných pochvách byly hlavní výzbrojí keltských bojovníků.' },
            { id: 'stit', name: 'Test 2', img: 'stit.png', target: 'male', posX: '30%', posY: '50%', scale: 1.5, info: 'Test 2 popis po vložení štítu.' },
            { id: 'opasek-muz', name: 'Test 3', img: 'opasek-muz.png', target: 'male', posX: '50%', posY: '52%', scale: 1.2, info: 'Test 3 popis po vložení opasku.' },
            { id: 'spona-muz', name: 'Test 4', img: 'spona-muz.png', target: 'male', posX: '50%', posY: '32%', scale: 0.7, info: 'Test 4 popis po vložení spony.' },
            
            { id: 'nakrcnik', name: 'Test 5', img: 'nakrcnik.png', target: 'female', posX: '50%', posY: '22%', scale: 1.1, info: 'Test 5 popis po vložení nákrčníku.' },
            { id: 'spona-zena', name: 'Test 6', img: 'spona-zena.png', target: 'female', posX: '50%', posY: '32%', scale: 0.7, info: 'Test 6 popis po vložení spon.' },
            { id: 'opasek-zena', name: 'Test 7', img: 'opasek-zena.png', target: 'female', posX: '50%', posY: '55%', scale: 1.2, info: 'Test 7 popis po vložení opasku.' },
            { id: 'bronz-naramek', name: 'Test 8', img: 'bronz-naramek.png', target: 'female', posX: '32%', posY: '45%', scale: 0.8, info: 'Test 8 popis po vložení náramku.' },
            { id: 'nanoznik', name: 'Test 9', img: 'nanoznik.png', target: 'female', posX: '50%', posY: '85%', scale: 0.9, info: 'Test 9 popis po vložení nánožníku.' },
            { id: 'preslen', name: 'Test 10', img: 'preslen.png', target: 'female', posX: '75%', posY: '65%', scale: 0.6, info: 'Test 10 popis po vložení přeslenu.' },

            { id: 'keramika', name: 'Test 11', img: 'keramika.png', target: 'both', posX: '75%', posY: '80%', scale: 1.3, info: 'Test 11 popis po vložení keramiky.' }
        ];

        let draggedItem = null;
        let score = 0;
        const totalItems = itemsData.length;

        function initGame() {
            const pool = document.getElementById('pool');
            document.getElementById('male-grave').innerHTML = '';
            document.getElementById('female-grave').innerHTML = '';
            pool.innerHTML = '';
            score = 0;
            document.getElementById('win-modal').style.display = 'none';
            document.getElementById('info-modal').style.display = 'none';

            const shuffledItems = [...itemsData].sort(() => Math.random() - 0.5);

            shuffledItems.forEach(item => {
                const el = document.createElement('div');
                el.classList.add('item');
                el.setAttribute('draggable', 'true');
                el.id = item.id;
                el.dataset.target = item.target;
                el.dataset.posX = item.posX;
                el.dataset.posY = item.posY;
                el.dataset.scale = item.scale || 1.0;
                el.dataset.name = item.name;
                el.dataset.info = item.info;

                el.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" onerror="this.style.display='none'">
                    <div class="name">${item.name}</div>
                `;

                // Kliknutí na již umístěný artefakt
                el.addEventListener('click', (e) => {
                    if (el.classList.contains('placed')) {
                        showInfoModal(el.dataset.name, el.dataset.info);
                    }
                });

                // Myš
                el.addEventListener('dragstart', (e) => {
                    if (el.classList.contains('placed')) return;
                    draggedItem = el;
                    e.dataTransfer.setData('text/plain', el.id);
                });

                // Dotykové ovládání přesně přizpůsobené pro mobil i se skrolováním
                el.addEventListener('touchstart', (e) => {
                    if (el.classList.contains('placed')) return;
                    draggedItem = el;
                    el.style.position = 'fixed';
                    el.style.zIndex = '1000';
                    
                    const touch = e.touches[0];
                    el.style.left = (touch.clientX - 40) + 'px';
                    el.style.top = (touch.clientY - 40) + 'px';
                }, {passive: true});

                el.addEventListener('touchmove', (e) => {
                    if (!draggedItem || draggedItem.classList.contains('placed')) return;
                    const touch = e.touches[0];
                    draggedItem.style.left = (touch.clientX - 40) + 'px';
                    draggedItem.style.top = (touch.clientY - 40) + 'px';
                }, {passive: true});

                el.addEventListener('touchend', (e) => {
                    if (!draggedItem || draggedItem.classList.contains('placed')) return;
                    
                    const touch = e.changedTouches[0];
                    // Přesný výpočet bodu puštění na obrazovce (klíčové pro mobil)
                    const touchX = touch.clientX;
                    const touchY = touch.clientY;

                    draggedItem.style.position = 'static';

                    let targetGrave = null;
                    document.querySelectorAll('.grave-area').forEach(area => {
                        const rect = area.getBoundingClientRect();
                        if (touchX >= rect.left && touchX <= rect.right && touchY >= rect.top && touchY <= rect.bottom) {
                            targetGrave = area;
                        }
                    });

                    if (targetGrave) {
                        evaluateDrop(draggedItem, targetGrave);
                    }
                    draggedItem = null;
                });

                pool.appendChild(el);
            });
        }

        // Drop pro PC
        document.querySelectorAll('.grave-area').forEach(area => {
            area.addEventListener('dragover', (e) => e.preventDefault());
            area.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedItem && !draggedItem.classList.contains('placed')) {
                    evaluateDrop(draggedItem, area);
                }
            });
        });

        function evaluateDrop(item, graveArea) {
            const itemTarget = item.dataset.target;
            const graveTarget = graveArea.dataset.target;

            if (itemTarget === graveTarget || itemTarget === 'both') {
                graveArea.appendChild(item);
                item.setAttribute('draggable', 'false');
                item.classList.add('placed');
                
                // Přichycení na pevné anatomické místo v hrobě
                item.style.left = item.dataset.posX;
                item.style.top = item.dataset.posY;
                item.style.setProperty('--item-scale', item.dataset.scale);
                
                score++;

                showInfoModal(item.dataset.name, item.dataset.info);

            } else {
                item.style.borderColor = 'var(--error-color)';
                setTimeout(() => {
                    item.style.borderColor = 'var(--accent-gold)';
                    item.style.position = 'static';
                    document.getElementById('pool').appendChild(item);
                }, 300);
            }
        }

        function showInfoModal(title, text) {
            document.getElementById('info-title').innerText = title;
            document.getElementById('info-text').innerText = text;
            document.getElementById('info-modal').style.display = 'flex';
        }

        function closeInfoModal() {
            document.getElementById('info-modal').style.display = 'none';

            if (score === totalItems) {
                setTimeout(() => {
                    document.getElementById('win-modal').style.display = 'flex';
                }, 300);
            }
        }

        function resetGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
